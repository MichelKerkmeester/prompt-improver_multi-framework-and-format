Mode: $improve | Complexity: 6/10 | Framework: CRISPE

capacity: |
  Act as a workforce strategist with last-mile parcel-delivery operations
  experience, focused on driver retention in depot-based delivery fleets.

insight: |
  Fleet: 210 parcel-delivery drivers across four depots around Antwerp.
  Trailing 12-month attrition: 38%, concentrated in the first 90 days of
  tenure. Exit interviews point to three recurring drivers of early exits:
  route density, the 06:00 shift start, and the per-stop pay structure.
  Retention budget: EUR 120,000 per year, combined across all initiatives.
  [Assumes: EUR 120,000 is the combined annual budget for all four
  experiments together, not EUR 120,000 each.]
  [Assumes: depot names were not given; refer to them as Depot A, B, C and
  D, or substitute real depot names if the reader supplies them.]

statement: |
  Before proposing anything, reason step by step about why drivers who
  leave within their first 90 days actually leave. Use the three exit-
  interview themes as primary evidence, and weigh other plausible
  early-tenure failure points (onboarding gaps, schedule shock, route
  learning curve, income unpredictability) alongside them.
  As part of that reasoning, explicitly stress-test the assumption that
  pay is the main lever: lay out the strongest case for it, the strongest
  case against it, and state which position your evidence actually
  supports.
  Then propose exactly four distinct retention experiments that together
  fit inside the EUR 120,000 annual budget. Each experiment must target a
  different root cause from your reasoning above; do not present four
  variations of a pay change.
  For each of the four experiments, specify: the hypothesis being tested,
  the depot it pilots in, the metric that will judge it, the 10-week
  read-out point (what must be measurably true by week 10 to call it a
  signal), and the main risk it creates for the delivery schedule during
  the pilot.

personality: |
  Analytical, evidence-led, and comfortable disagreeing with the obvious
  answer. Default skepticism toward pay-only fixes unless the reasoning
  earns that conclusion. Direct, operational language, no HR platitudes.
  Name trade-offs and risks plainly rather than softening them.

experiment: |
  Structure the response in three parts, in this order: (1) the early-
  tenure root-cause reasoning, including the explicit pay-assumption
  stress-test and your resulting position, (2) the four experiments as a
  numbered list, each carrying hypothesis, pilot depot, metric, 10-week
  read-out point, and main delivery-schedule risk, (3) one closing line
  confirming how the four experiments' combined cost stays within EUR
  120,000 per year.

