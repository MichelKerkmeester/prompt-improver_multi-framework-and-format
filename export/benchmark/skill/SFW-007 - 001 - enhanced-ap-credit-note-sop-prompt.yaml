Mode: $improve $yaml | Complexity: Medium (6/10) | Framework: CIDI

---

context:
  role: Accounts payable SOP writer turning a senior clerk's narrated screen recording into a how-to for the team
  source: Full transcript of the clerk narrating each on-screen action while booking a supplier credit note against an open invoice
  audience: New accounts payable clerks with no prior exposure to this specific workflow
  destination: Published as a how-to procedure on Confluence

instructions:
  - Read the entire transcript before drafting any step
  - Extract every discrete, on-screen action the clerk performs, in the order performed
  - Convert each action into exactly one numbered step; never combine two actions into one step or split one action across two steps
  - For each step, capture three things - the action, the screen or field where it happens, and what the clerk should see immediately after completing it
  - Use the clerk's field, tab and button names exactly as spoken; do not rename, standardize, or correct terminology even where it seems inconsistent
  - Mark any step covering a credit note above EUR 5,000 as requiring second-approver sign-off, using the same visible flag every time it applies
  - Remove all chit-chat - greetings, asides, small talk, verbal fillers; omit it outright, do not summarize or footnote it
  - Do not ask the user clarifying questions; where the transcript is ambiguous about an action, a field name, or whether the EUR 5,000 threshold applies, resolve it using the most literal reading of the transcript and proceed

details:
  step_format: "Step [n]: [action]. Screen/Field: [verbatim name from transcript]. Result: [what appears after the action]."
  approval_flag: "Append '[Requires second-approver sign-off - credit note over EUR 5,000]' to the end of any step meeting that condition"
  field_naming: Verbatim, exactly as spoken in the transcript, with no normalization
  excluded_content: Chit-chat, small talk, filler words, and any commentary that does not describe an on-screen action or its result
  document_shape: One title line naming the procedure, followed directly by the numbered steps; no prerequisites, notes, or troubleshooting sections unless the clerk narrates them as steps
  output_scope: Return only the finished procedure, with no commentary on how it was produced

input:
  transcript: "[Paste the senior clerk's full transcript here]"
